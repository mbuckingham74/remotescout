services:
  remotescout-app:
    build: .
    container_name: remotescout-app
    restart: unless-stopped
    env_file: .env
    environment:
      - REMOTESCOUT_DATABASE_PATH=/app/instance/remotescout.db
    volumes:
      - ./instance:/app/instance
    networks:
      - npm_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  npm_network:
    external: true
